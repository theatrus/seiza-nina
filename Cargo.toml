[package]
name = "seiza-nina-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[lib]
name = "seiza_nina_native"
path = "native/src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
seiza = "=0.40.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.11"

[dev-dependencies]
tempfile = "3"
